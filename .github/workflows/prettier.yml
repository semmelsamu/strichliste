name: Prettier

on:
    push:

jobs:
    prettier:
        name: Prettier
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install Node dependencies
              run: npm ci --ignore-scripts

            - name: Run Prettier
              run: npx prettier --check 'resources/views/**/*.blade.php'
